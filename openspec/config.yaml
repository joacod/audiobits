schema: spec-driven
context: |
  Public repository: use relative paths and public references; never include
  private handoffs, personal information, local machine paths, or secrets.
  AudioBits is a framework-independent procedural browser audio runtime plus
  an independently deployable documentation site in one pnpm monorepo.
  Initial development and acceptance target Chromium only. Broader browser
  testing is deferred until the core works and must not delay that milestone.
  Library changes must work in the local site without publishing to npm.
  npm publication requires a working core and separate explicit approval.
  Follow docs/roadmap.md in order, one authorized step at a time.
rules:
  proposal:
    - State prerequisites, scope, and exclusions; keep each change bounded.
    - Do not describe proposed behavior as implemented or verified.
  specs:
    - Specify observable behavior with positive and failure scenarios.
    - Keep initial browser requirements Chromium-only.
  design:
    - Explain resource ownership and package boundaries where relevant.
    - Keep speculative ecosystem work outside the core milestone.
  tasks:
    - Include focused verification and documentation in each task group.
    - Keep implementation tasks unchecked until executed and verified.
operations:
  apply:
    guidance:
      - Work only on the selected authorized step and stop at its review gate.
  archive:
    guidance:
      - Archive only after all tasks and the step acceptance gate are complete.
