<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AudioBits vanilla consumer</title>
  </head>
  <body>
    <main>
      <h1>AudioBits vanilla consumer</h1>
      <p>Framework-independent AudioBits browser integration example.</p>
      <p id="status"></p>
      <button id="play">Play confirmation</button>
      <button id="mute" aria-pressed="false">Mute</button>
      <button id="stop">Stop all</button>
      <p id="level">Output peak: 0.000</p>
      <label
        >Effects volume (dB)<input
          id="volume"
          type="range"
          min="-60"
          max="0"
          step="1"
          value="0"
      /></label>
      <h2>Impact</h2>
      <label
        >Intensity
        <input
          id="intensity"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.5"
      /></label>
      <button id="impact">Play impact</button>
      <h2>Thruster</h2>
      <label
        >Throttle
        <input
          id="throttle"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.2"
      /></label>
      <button id="thruster">Start thruster</button>
      <button id="thruster-stop">Stop thruster</button>
      <p id="thruster-state">Thruster: stopped</p>
      <p id="audio-state" role="status">Audio: idle</p>
      <p id="audio-error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
