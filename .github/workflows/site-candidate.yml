name: Prepare site candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audiobits-site-deployment
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:site
      - uses: actions/upload-artifact@v4
        with:
          name: development-site-candidate
          path: |
            apps/www/.next/
            !apps/www/.next/cache/
          if-no-files-found: error
          include-hidden-files: true
  deploy:
    # Provider, production ref and reviewers are unresolved activation inputs.
    if: ${{ false }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: site-production
    steps:
      - run: |
          echo "Deployment disabled: configure provider and authorize reviewed release-aligned source."
          exit 1
