name: Prepare npm candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audiobits-npm-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/ci/setup-linux-audio.sh
      - run: pnpm release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-npm-candidate
          path: node_modules/.cache/audiobits-release/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-failures
          path: test-results/
          retention-days: 7
