name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  select-scope:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/select-scope.mjs
  quality:
    needs: select-scope
    runs-on: ubuntu-24.04
    env:
      CHECK_SCOPE: ${{ needs.select-scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The snapshot check reads its pinned catalog commit, absent in depth-1 checkout.
      - if: fromJSON(env.CHECK_SCOPE).kind != 'docs' && fromJSON(env.CHECK_SCOPE).kind != 'artifact'
        run: git fetch --depth=1 origin "$(jq -r .revision tools/mcp/snapshot.json)"
      - run: node scripts/ci/run-checks.mjs quality
  chromium-integration:
    needs: select-scope
    runs-on: ubuntu-24.04
    env:
      CHECK_SCOPE: ${{ needs.select-scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: fromJSON(env.CHECK_SCOPE).package || fromJSON(env.CHECK_SCOPE).consumers || fromJSON(env.CHECK_SCOPE).site
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build work
        if: fromJSON(env.CHECK_SCOPE).site
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/www/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      - if: fromJSON(env.CHECK_SCOPE).package || fromJSON(env.CHECK_SCOPE).consumers || fromJSON(env.CHECK_SCOPE).site
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: fromJSON(env.CHECK_SCOPE).package || fromJSON(env.CHECK_SCOPE).consumers || fromJSON(env.CHECK_SCOPE).site
        run: bash scripts/ci/setup-linux-audio.sh
      - run: node scripts/ci/run-checks.mjs browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: chromium-failures
          path: test-results/
          retention-days: 7
  checks:
    if: always()
    needs: [select-scope, quality, chromium-integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-required.mjs
