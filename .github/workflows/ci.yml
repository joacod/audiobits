name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Start a clocked audio sink for headless Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          # The default null sink permits two-second buffers; keep its clock responsive.
          pactl load-module module-null-sink sink_name=audiobits_ci norewinds=1
          pactl set-default-sink audiobits_ci
      - run: pnpm test:package
        id: package
      - run: pnpm test:browser
        # Report independent browser failures even if the packed consumer fails.
        if: success() || (failure() && steps.package.outcome == 'failure')
