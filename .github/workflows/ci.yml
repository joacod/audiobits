name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js build work
        uses: actions/cache@v4
        with:
          path: apps/www/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      # The snapshot check reads its pinned catalog commit, absent in depth-1 checkout.
      - run: git fetch --depth=1 origin "$(jq -r .revision tools/mcp/snapshot.json)"
      - run: pnpm verify:local
      - run: pnpm build:prepared
      - run: pnpm exec publint packages/audiobits --strict
  chromium-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js build work
        uses: actions/cache@v4
        with:
          path: apps/www/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: bash scripts/ci/setup-linux-audio.sh
      - run: pnpm prepare:browser
      - run: pnpm test:package:prepared
      - run: pnpm test:browser:smoke:prepared
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failures
          path: test-results/
          retention-days: 7
