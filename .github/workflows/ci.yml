name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cross_browser:
        description: Run the optional Firefox and WebKit checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  scope:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      chromium: ${{ steps.scope.outputs.chromium }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - id: scope
        run: node scripts/ci/select-checks.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec publint packages/audiobits --strict
  chromium-integration:
    needs: scope
    if: needs.scope.outputs.chromium == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/ci/setup-linux-audio.sh
      - run: pnpm test:browser --project=chromium
        id: browser
      - run: pnpm test:package
        if: success() || (failure() && steps.browser.outcome == 'failure')
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failures
          path: test-results/
          retention-days: 7
  cross-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.cross_browser
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: bash scripts/ci/setup-linux-audio.sh
      - run: pnpm test:browser --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.browser }}-failures
          path: test-results/
          retention-days: 7
