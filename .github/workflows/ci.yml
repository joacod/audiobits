name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  select-scope:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/select-scope.mjs
  quality:
    needs: select-scope
    runs-on: ubuntu-24.04
    env:
      CHECK_SCOPE: ${{ needs.select-scope.outputs.scope }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The snapshot check reads its pinned catalog commit, absent in depth-1 checkout.
      - if: fromJSON(env.CHECK_SCOPE).kind != 'docs' && fromJSON(env.CHECK_SCOPE).kind != 'artifact'
        run: git fetch --depth=1 origin "$(jq -r .revision tools/mcp/snapshot.json)"
      - run: node scripts/ci/run-checks.mjs quality
  chromium-integration:
    needs: select-scope
    runs-on: ubuntu-24.04
    env:
      CHECK_SCOPE: ${{ needs.select-scope.outputs.scope }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: fromJSON(env.CHECK_SCOPE).package || fromJSON(env.CHECK_SCOPE).consumers || fromJSON(env.CHECK_SCOPE).site
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build work
        if: fromJSON(env.CHECK_SCOPE).site
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/www/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      - if: fromJSON(env.CHECK_SCOPE).package || fromJSON(env.CHECK_SCOPE).consumers || fromJSON(env.CHECK_SCOPE).site
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: fromJSON(env.CHECK_SCOPE).package || fromJSON(env.CHECK_SCOPE).consumers || fromJSON(env.CHECK_SCOPE).site
        run: bash scripts/ci/setup-linux-audio.sh
      - run: node scripts/ci/run-checks.mjs browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: chromium-failures
          path: test-results/
          retention-days: 7
  checks:
    if: always()
    needs: [select-scope, quality, chromium-integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-required.mjs
