<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo Probe acoustic bench</title>
  <style>
    body {
      font: 16px/1.6 system-ui;
      max-width: 48rem;
      margin: 8vh auto;
      padding: 1rem;
    }
    button {
      font: inherit;
      margin: 0.3rem;
      padding: 0.6rem;
    }
  </style>
  <h1>Echo Probe acoustic bench</h1>
  <p>
    Compare the pulse alone, then distance, surface, strength, and stereo
    returns. Each gesture uses seed 42.
  </p>
  <div id="scenarios"></div>
  <button id="stop">Stop</button>
  <p id="state" role="status">Stopped</p>
  <p id="error" role="alert"></p>
  <script type="module">
    import { mountEchoProbe } from "./host.ts";
    const host = mountEchoProbe({
      state(value) {
        document.querySelector("#state").textContent = value;
      },
      error(cause) {
        document.querySelector("#error").textContent =
          `${cause.message}. Try again.`;
      },
    });
    const r = (distance, pan, intensity, surface) => ({
      distance,
      pan,
      intensity,
      surface,
    });
    const scenarios = {
      "Emission alone": [],
      "Near / far": [r(0.1, -0.5, 0.9, 0.7), r(0.85, 0.5, 0.9, 0.7)],
      "Dark / bright": [r(0.35, -0.65, 1, 0), r(0.7, 0.65, 1, 1)],
      "Strong / weak": [r(0.2, -0.5, 1, 0.7), r(0.6, 0.5, 0.25, 0.7)],
      "Left / right": [r(0.25, -0.9, 1, 0.7), r(0.65, 0.9, 1, 0.7)],
      "Small chamber": [
        r(0.15, -0.8, 0.8, 0.85),
        r(0.35, 0.7, 0.7, 0.2),
        r(0.6, 0.1, 0.9, 1),
      ],
    };
    for (const [label, reflections] of Object.entries(scenarios)) {
      const button = document.createElement("button");
      button.textContent = label;
      button.onclick = () => {
        document.querySelector("#error").textContent = "";
        void host.emit(reflections);
      };
      document.querySelector("#scenarios").append(button);
    }
    document.querySelector("#stop").onclick = host.stop;
  </script>
</html>
